<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <link rel="stylesheet" href="style.css">
    <title>Product Card</title>
</head>
<body>
    
    <nav>
        <ul>
            <li>Home</li>
            <li>Shop</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
    
    <main>

        <div class="card">
                <span id="discount">-30%</span>
            <div class="product-image">
                <img src="headphone.jpg" alt="Aria Headphone Picture">
            </div>

            <div class="product-info">

                <h3>Aria Wireless Headphones</h3>

                <span id="description">
                    Active noise-cancelling, plush earcups, and 30 hours of battery life on a single charge.
                </span>

                <div class="price">
                    <span id="current">$69.99</span>
                    <span id="original">$99.99</span>
                </div>

                <div class="buttons">
                    <button id="addToCart">Add to Cart</button>
                    <button id="addToWish">Add to Wishlist</button>
                </div>

            </div>

        </div>

        <div id="notif">⚠ Only 3 left in stock</div>

    </main>

</body>
</html>
